name: Gerar Newsletter Diario

on:
  schedule:
    # Gerado automaticamente pelo painel admin
    - cron: '15 12 * * *'
  workflow_dispatch:

jobs:
  gerar:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install playwright edge-tts
          playwright install chromium --with-deps

      - name: Coletar noticias
        run: python scrap_news.py

      - name: Gerar newsletter
        run: python gerar_jornal.py diario output/secao_resumo_anterior.html output/secao_agenda.html output/secao_resumo_dia.html

      - name: Deploy to Netlify
        run: |
          npm install -g netlify-cli
          netlify deploy --dir=./output --prod --site=${{ secrets.NETLIFY_SITE_ID }} --auth=${{ secrets.NETLIFY_AUTH_TOKEN }} --message="Deploy automatico"
